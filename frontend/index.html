<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/krish.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakinaka Tour | Official Devotional & Community Tours</title>
    <!-- Google Fonts for clean, professional, human typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAFAFA] text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900">
    <!-- Stealth anchor for client-side translation engine (zero backend load) -->
    <div id="google_translate_element" style="position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -9999; overflow: hidden;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,gu,bn,ta,te,kn,pa,ml,or,as,ur,sa,bho',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
